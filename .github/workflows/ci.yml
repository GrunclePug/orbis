name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: System packages
        # lavapipe for the headless GUI tests, bsdtar for .7z/.rar manual mods.
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libarchive-tools
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
