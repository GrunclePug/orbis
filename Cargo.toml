[package]
name = "orbis"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
description = "KSP mod manager with Prism-style instances, built on CKAN metadata"
license = "MIT"
repository = "https://github.com/grunclepug/orbis"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "clipboard", "links"] }
env_logger = "0.11.11"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
log = "0.4.35"
png = "0.18.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = "1.2.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
